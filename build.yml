name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Agar sirf setup_project.py upload kiya hai to ye poora project bana dega
      - name: Project files generate karo (agar setup_project.py hai)
        run: |
          if [ -f setup_project.py ]; then python3 setup_project.py; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK build karo
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NobitaFF-APK
          path: app/build/outputs/apk/debug/app-debug.apk
